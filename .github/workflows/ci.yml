name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; a new push cancels an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: hermetic suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # The suite runs Qt without a display; the offscreen plugin is what the
      # UI tests already expect.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Typography gate
        run: python tools/check_typography.py

      - name: Everything imports
        run: python -m compileall -q themob tests tools

      - name: Hermetic tests
        # The docker suite needs a daemon and built worker images; it is not
        # part of the fast signal. See the images job for a manual run.
        run: python -m pytest -m "not docker" -q

  package:
    name: wheel installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel . --no-deps -w dist
      - name: Install it into a clean environment and import headless
        # No PyQt6: proves the report and dynamic-findings paths carry no Qt
        # import, which is a property the code promises and a wheel can break.
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install pydantic networkx
          /tmp/fresh/bin/pip install --no-deps dist/themob-*.whl
          /tmp/fresh/bin/python -c "import themob; from themob.report import build; from themob.dynamic.findings import from_frida; print(themob.__version__)"
          test -f /tmp/fresh/share/themob/knowledge/android-weaknesses.json

  secrets:
    name: no secrets in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned to a release rather than a floating tag: a scanner you cannot
        # reproduce is a scanner you cannot trust.
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
